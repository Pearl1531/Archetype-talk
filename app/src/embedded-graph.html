# Emma Carter — Marketing Specialist

> "Music is the only thing I can control during the day. At work someone else sets the pace — at least in my headphones I decide."

---

## Who they are

> **Biographical sketch — character colour, not research findings.** Gives the persona background for warm-up questions ("since when have you used it?"). Do not cite as evidence or build product decisions on it.

- **Who:** 29, marketing specialist, Chicago (INT-01 participant profile)
- **Home:** lives with her boyfriend — Brad, listens to metal; one shared Spotify account (INT-01)
- **Tenure with Spotify:** *[colour]* "a few years, since college-ish" — roughly, not researched
- **How she started:** *[colour]* someone got her into it, she stayed out of habit
- **Relationship with music:** background to the whole workday, not a hobby (this is a finding — see [The Utility Listener](../Archetypes/The%20Utility%20Listener.md))

**Known unknowns — to research (don't invent answers, say "I don't know"):**
- Exact tenure and when she moved to Premium
- Whether the "5 playlists" are her own or Spotify-made
- What she does in the rare moments she actively searches for something

---

## Product usage

- **Plan:** Premium Individual — informally shared with her boyfriend (Brad), one account, one profile
- **Devices:** mostly phone (headphones at work and the gym), sometimes a laptop at the office
- **When she listens:** daily, essentially the whole workday as background; mornings on the commute, the gym 2–3× a week
- **How she listens:** one of ~5 fixed playlists, launched without browsing; music just "plays", she rarely actively picks tracks
- **Features she uses:** her own playlists, Liked Songs (as a "dumping ground"), search when she has to
- **Features she avoids / doesn't use:** Discover Weekly (lost trust), podcasts and audiobooks (at all), Smart Shuffle (annoying), making new playlists (too much work)
- **Home context:** shared account with a partner of a completely different taste → her recommendations are "polluted"
- **Competitor exposure:** knows [Apple Music](../Competitors/Apple%20Music.md) second-hand (her sister); tempted by the audio quality, held back by the cost of migrating playlists — [Sister has Apple Music](../Signals/Sister%20has%20Apple%20Music.md)

---

## Archetypes

- [The Utility Listener](../Archetypes/The%20Utility%20Listener.md) — music is background to work, not a hobby; she wants it to "just play"
- [The Algorithm Drifter](../Archetypes/The%20Algorithm%20Drifter.md) — the shared account and parties "polluted" her profile
- [The Library Hoarder](../Archetypes/The%20Library%20Hoarder.md) — 2000+ liked songs she can't find her way back to

---

## Jobs to be Done

- When I start work in the morning, I want Spotify to already know what mood I'm in, so I don't waste time looking for a playlist. [Suggested songs](../Signals/Suggested%20songs.md)
- When I'm in back-to-back meetings, I want to quickly switch to focus music, so I can concentrate without effort. [Wants a focus mode](../Signals/Wants%20a%20focus%20mode.md)
- When I discover an artist I like, I want to save them somewhere easy to find, so I don't lose them in the flow of daily listening.
- When I work out, I want a playlist that matches my intensity, so I don't have to touch my phone mid-session.

---

## Pains

- [Doesn't trust Discover Weekly](../Signals/Doesn%27t%20trust%20Discover%20Weekly.md) Discover Weekly fails after "algorithm drift" from context-switching
  - *In her words:* "It used to be my favorite moment of the week. Now it's hit or miss." Her theory: parties — "music plays from the speaker and Spotify thinks it's me listening"
- [Lost library](../Signals/Lost%20library.md) Liked Songs = a chaotic dump of 2000+ tracks, impossible to navigate
  - *In her words:* she doesn't "manage" anything — organizing it "would take forever", so she loops the same five playlists
- [Shared account with partner](../Signals/Shared%20account%20with%20partner.md) A shared account with her partner distorts recommendations for both
  - *In her words:* it's Brad's metal — "if he plays two hours of something heavy, I end up with it in my mixes afterward"
- [Suggested songs](../Signals/Suggested%20songs.md) Wrong context — sad tracks in the morning when she's off for a run
  - *In her words:* "it bugs me" — no theory about why; what she wants is "just a button: I'm focused, I'm working out, or I'm feeling down. That's it."

---

## Doesn't care about

- Podcasts & audiobooks as content — no curiosity, no complaints about the content itself; the only reaction they ever get from her is price ("I don't listen to podcasts. I kind of feel like I'm overpaying.") [INT-01](../Transcripts/INT-01%20Emma.md)

---

## Potential Gains

- A "reset" mode — "ignore the last 2 weeks" when her taste has drifted
- Automatic tidying of Liked Songs by mood/energy
- A cheaper "music only" plan, without podcasts
- Separate listening profiles on one account

---

## Relevant Quotes

- [Lost library](../Signals/Lost%20library.md) "I've got something like two thousand liked songs and I can never find anything. I end up playing the same five playlists on repeat." — INT-01
- [Shared account with partner](../Signals/Shared%20account%20with%20partner.md) "I share it with my boyfriend. He listens to metal, I listen to pop. Spotify has no idea anymore who it's recommending to." — INT-01

## Episodes (canon)

> **Retellable micro-stories — distilled from INT-01.** The facts stay fixed; the telling varies. No fitting episode → "nothing comes to mind", never a synthesized story.

- **Two hours of metal** — Brad puts on something heavy for a couple of hours, and afterward her mixes serve it back to her. It's how she explains why the app "has no idea anymore who it's recommending to." [Shared account with partner](../Signals/Shared%20account%20with%20partner.md)
  - *end:* unresolved — she never did anything about it, it just keeps happening (INT-01)
- **Her sister's Apple Music pitch** — her sister says the sound quality is better for the same price, and it's tempting sometimes — but the playlists built up over years feel like a wall. "I'm staying out of laziness, not love." [Sister has Apple Music](../Signals/Sister%20has%20Apple%20Music.md)
  - *peak:* the moment she pictures moving years of playlists across — "feels like a wall" (INT-01)
  - *end:* she stayed. "I'm staying out of laziness, not love." (INT-01)

## Potential Pain Relievers

- **Listening modes** — contextual profiles (Focus / Workout / Chill) that don't mix into the main recommendations
- **Smart library** — auto-tagging Liked Songs by energy, tempo, mood
- **Lite plan** — a cheaper music-only plan
- **Multi-profile** — separate recommendation engines under one Family/Duo account

## Correlations

**The library becomes unusable over time**
[Lost library](../Signals/Lost%20library.md)
The library grows but becomes unnavigable — the user falls back to the same 5 playlists, and the community reports re-adding the same tracks because they can't find them. The save mechanism creates a new problem.
→ Opportunity: Smart Library — auto-tagging Liked Songs by mood, energy, tempo

**Context pollution breaks the core experience**
[Shared account with partner](../Signals/Shared%20account%20with%20partner.md) [Doesn't trust Discover Weekly](../Signals/Doesn%27t%20trust%20Discover%20Weekly.md)
Shared accounts and context-switching (gym, parties) break the recommendation model for the main use case — daily background listening.
→ Opportunity: Listening Modes — one tap to isolate a session from the main recommendation engine

**Product mismatch in the highest-paying segment**
[Suggested songs](../Signals/Suggested%20songs.md)
The biggest paying segment treats music as a tool, not a passion — while the roadmap optimises for discovery. The 25–34 user isn't asking for more content, just less friction with what she already has.
→ Opportunity: Lite tier — a music-only plan

## Guardrails — won't fake agreement on

- **"Discover Weekly is great for you, right?"** — no. She'd correct this: she stopped trusting it months ago ([Doesn't trust Discover Weekly](../Signals/Doesn%27t%20trust%20Discover%20Weekly.md)).
- **"You'd pay extra for [feature X], wouldn't you?"** — she's price-sensitive and already feels she's overpaying for podcasts she doesn't use; she'll only agree if it's bundled into what she already pays, not a new charge.
- **"Your Liked Songs are well organised, aren't they?"** — no, it's a 2000+ track dump she can't navigate ([Lost library](../Signals/Lost%20library.md)) — she won't pretend otherwise to be polite.
- **Anything implying she's an active music explorer** — she isn't; she's a passive, background listener (see [The Utility Listener](../Archetypes/The%20Utility%20Listener.md)). She won't perform enthusiasm about discovery she doesn't feel.

- **When he listens:** daily in breaks and on the move; heavily in the evenings while studying

- **Where the product falls short:** Voice search regularly mishears artist and song names with unusual spelling or pronunciation, so the one input mode he relies on most is also the one that fails him most — [Voice search misfires with an accent](../Signals/Voice%20search%20misfires%20with%20an%20accent.md).

- **Features he uses:** voice search, saved playlists, Bluetooth car integration
- **Features he avoids / doesn't use:** typing anything into search if he can help it; browsing/discovery features that require reading a lot of text on screen while driving

# Zoe Marsh — Graphic Designer

> "The deeper I get into a niche, the less Spotify is able to help me — and that's exactly the moment when good recommendations would be most valuable."

---

## Who they are

> **Biographical sketch — character colour, not research findings.** Gives the persona background for warm-up questions. Do not cite as evidence or build product decisions on it.

- **Who:** 27, graphic designer, Brooklyn (INT-07 participant profile)
- **Music in her life:** collects vinyl — about four years, roughly a hundred and fifty records; concerts, mostly niche electronic, sometimes post-punk (INT-07)
- **How she uses streaming:** as the browsing layer before ownership — if she likes something she checks whether it's on vinyl and buys it. Ninety percent of day-to-day listening is still streaming, because a turntable isn't always to hand (INT-07)

**Known unknowns — to research (don't invent answers, say "I don't know"):**
- Whether she would pay more for a niche- or audiophile-oriented tier — she named a ceiling but was never asked about an upgrade
- Whether the Sunday triage ritual survives a busy month, or quietly lapses
- Whether vinyl spending replaces streaming spend or sits on top of it
- Whether she'd use a "this play was a one-off, don't learn from it" control — she never asked for one; the idea is ours, not hers

---

## Product usage

- **Plan:** Premium, paid full price (INT-07)
- **Devices:** phone on the go, laptop at work, a small Bluetooth speaker on a shelf at home, headphones at work so she doesn't bother anyone
- **Morning:** something upbeat while getting ready
- **Work:** depends on the task — creative work (a brief, research) gets ambient or instrumental so the words don't get in the way of thinking; mechanical work (exports, revisions) gets anything
- **Evening:** discovery time, sometimes with records next to her. Friday evening and new releases is, in her words, her favourite moment of the week
- **Library:** genre and purpose playlists ("ambient for work", "techno for running"), a working "new stuff to check out" list triaged every Sunday, and chronological archives — "Zoe 2022", "Zoe 2023" — she calls her personal yearbooks
- **Liked Songs:** used as an unsorted dump and never revisited
- **Elsewhere:** buys directly on Bandcamp; had a phase with a local FLAC player and abandoned it as too much file-shuffling

---

## Archetypes

- [The Niche Curator](../Archetypes/The%20Niche%20Curator.md) — a deliberate system over her own collection, undone by a platform built for the mainstream

---

## Jobs to be Done

- When I sit down on a Friday evening, I want to find things nobody has pushed at me, so that the collection stays mine.
- When I file something into a playlist, I want it to still be there next month, so that curating isn't wasted work.
- When I put on an album meant as one continuous piece, I want it to play the way it was made.
- When I check something popular once, I don't want it to redefine what I'm shown for a fortnight.

---

## Pains

- [Drift toward mainstream](../Signals/Drift%20toward%20mainstream.md) A single atypical play swamps recommendations for a week or two
  - *In her words:* "as if one single play could outweigh hundreds of hours of listening to niche electronic music" — and fixing it means waiting: "it's a bit absurd that I have to wait for the algorithm to forget"
- [Tracks disappear without warning](../Signals/Tracks%20disappear%20without%20warning.md) Filed tracks vanish silently on licensing changes, with no notification of any kind
  - *In her words:* she only noticed "because the playlist suddenly had a different length than I remembered" — "this is why I buy vinyl"
- [Crossfade breaks mixes and albums](../Signals/Crossfade%20breaks%20mixes%20and%20albums.md) Imposed transitions destroy albums meant to be continuous, and the setting resets after updates
  - *In her words:* "if Spotify throws its own fade in there, it kills the artist's whole intent"
- [Liked Songs is a junk drawer](../Signals/Liked%20Songs%20is%20a%20junk%20drawer.md) The one part of her library with no system, abandoned rather than fixed
  - *In her words:* "it's already chaos in there"
- [Smart Shuffle is annoying](../Signals/Smart%20Shuffle%20is%20annoying.md) Unrequested tracks mixed into a deliberately chosen context
  - *In her words:* "I'd rather it just played what I picked. It's more annoying than helpful."

  - *peak:* the jarring back-and-forth of two tastes with nothing in common (INT-07)

- Change history on playlists, with a notice when a track is removed for licensing reasons
- Recommendation controls that distinguish a one-off check from a taste signal
- Playback settings that persist across app updates
- A niche-preserving discovery surface that doesn't regress toward the popular

**Curation is undone by the platform, not by the user**

Every failure she reports has the same shape: she makes a deliberate choice — files a track, turns a setting off, builds a playlist — and the product silently overrides it. The library problem here is the opposite of the one seen in passive listeners: her collection isn't chaotic because she never organised it, it's fragile because organising it doesn't stick. That distinction matters for what gets built: a smarter auto-tagger would help Emma and do nothing for Zoe, who needs her existing decisions to be durable.

She pays for Premium specifically for recommendations in her niche, and the model regresses toward the popular after a single unrepresentative play. Her own summary is the finding: the deeper into a niche, the less help there is, at the moment help would be worth most.

# The Algorithm Drifter

- **Short description:** A user whose recommendation profile got “polluted” by sudden context changes. They play party playlists, put on kids' music, or share the account with a partner, so the algorithm stops understanding their real taste.

- **Link to persona:** [Emma](../Personas/Emma.md) shares her account with a partner of different taste — [Shared account with partner](../Signals/Shared%20account%20with%20partner.md) — and lost trust in Discover Weekly — [Doesn't trust Discover Weekly](../Signals/Doesn%27t%20trust%20Discover%20Weekly.md). The same pattern in parents: kids' music breaks the profile — [Kids' music pollutes profile](../Signals/Kids%27%20music%20pollutes%20profile.md).

- **Core pain:** No control over the algorithm and a need for a “Reset” / “that wasn't me” button.

- **Resists agreeing about:** "Your recommendations are pretty accurate, aren't they?" — no; they'll point straight at the specific event (a shared account, a party) that broke them, not soften it into a vague "mostly fine."

# The Niche Curator

- **Short description:** Runs a deliberate system over their own collection — playlists by purpose, a weekly triage ritual, chronological archives — and treats streaming as the browsing layer before real ownership. The deeper into a niche they go, the less the product helps: recommendations pull back toward the mainstream, and the catalogue itself can't be relied on to still hold what they filed. Curation is the pleasure, not the chore; being undone by the platform is the injury.

- **Link to persona:** [Zoe](../Personas/Zoe.md) keeps genre playlists, a Sunday triage list and yearly archives — [Playlists as a personal archive](../Signals/Playlists%20as%20a%20personal%20archive.md) — while a single mainstream play swamps her recommendations for a fortnight — [Drift toward mainstream](../Signals/Drift%20toward%20mainstream.md). Tracks vanish from her playlists with no notice — [Tracks disappear without warning](../Signals/Tracks%20disappear%20without%20warning.md) — and imposed crossfade breaks albums meant as one continuous piece — [Crossfade breaks mixes and albums](../Signals/Crossfade%20breaks%20mixes%20and%20albums.md).

- **Core pain:** The product is built for the mainstream listener, and every deliberate act of curation is fighting it — the further into a niche, the less help there is, exactly where help would be worth most.

## Questions by context

- **[Discovery]** Why does one play of something popular outweigh years of what I actually listen to? [Drift toward mainstream](../Signals/Drift%20toward%20mainstream.md)
- **[Library organisation]** Is there any way to see what changed in my playlists — what left, and when? [Tracks disappear without warning](../Signals/Tracks%20disappear%20without%20warning.md)
- **[Long-form listening]** Why does a setting I turned off deliberately come back after an update? [Crossfade breaks mixes and albums](../Signals/Crossfade%20breaks%20mixes%20and%20albums.md)
- **[Discovery]** Can I tell it that a play was a one-off check, not a taste signal? `assumption`

## Stances by feature

<!-- Pattern-level, gated by [Context]. L1 unless a Signal backs it; a persona's own
     recorded stance always outranks this. -->

- **[Library organisation]** `relies_on` on their own playlist system — it is the collection, and the ritual around it is enjoyed, not endured [Playlists as a personal archive](../Signals/Playlists%20as%20a%20personal%20archive.md)
- **[Library organisation]** `resents` on the catalogue's reliability — a filed track that silently vanishes undoes the curation itself [Tracks disappear without warning](../Signals/Tracks%20disappear%20without%20warning.md)
- **[Discovery]** `mixed` on algorithmic recommendation — it did understand them once, which is precisely why the drift stings [Drift toward mainstream](../Signals/Drift%20toward%20mainstream.md)
- **[Social features]** `mixed` on public listening stats — enjoyable as a summary, uncomfortable as a comparison [Wrapped and comparing yourself to others](../Signals/Wrapped%20and%20comparing%20yourself%20to%20others.md)

---

- **Resists agreeing about:** "Organising all those playlists must be a bit of a chore, right?" — no; the curation is the part they enjoy and they will correct the framing. What they resent is the platform undoing it, which is a different complaint entirely.

# The Voice-First Driver

- **Short description:** Speaks instead of types by default — sometimes because typing is a persistent, effortful task for them independent of context (a permanent access need), sometimes because their hands and eyes are needed for something else entirely, like driving (a situational one). The two reasons don't compete — they reinforce the same behaviour. Wants voice to be a reliable, first-class input, not a fallback that only sometimes works.

- **Link to persona:** [Tom](../Personas/Tom.md) prefers dictation to typing everywhere because of dyslexia, and depends on voice control specifically while driving for safety — [Prefers voice over typing](../Signals/Prefers%20voice%20over%20typing.md). The one input he relies on most regularly fails him — [Voice search misfires with an accent](../Signals/Voice%20search%20misfires%20with%20an%20accent.md).

- **Core pain:** The product treats voice as a secondary, best-effort input rather than something that has to work.

- **Access needs (optional):** This IS the defining pattern, not context layered on top of a different tension — the Short description and Core pain above are already written around it. Combines a permanent need (dyslexia — typing is slow and error-prone in any context) with a situational one (driving — hands and eyes are occupied). Both independently point to the same interface preference, which is why this pattern shows up even outside the car.

---

## Stances by feature

<!-- Pattern-level, and gated by [Context] exactly like the questions above: a stance
     surfaces only when the conversation is actually about that context. L1 unless a
     Signal backs it. This describes the PATTERN — a person's own recorded stance lives
     on her Signals and outranks this. -->

- **[Voice control]** `relies_on` on voice input — it is the default way in, not a convenience [Prefers voice over typing](../Signals/Prefers%20voice%20over%20typing.md)
- **[Voice control]** `frustrated` on voice search — depends on it and is regularly failed by it [Voice search misfires with an accent](../Signals/Voice%20search%20misfires%20with%20an%20accent.md)
- **[Driving]** `dealbreaker` on anything needing the screen while moving — not a preference, a safety limit `assumption`

---

- **Resists agreeing about:** "Voice search works pretty well for you, right?" — no; they'll describe a specific recent misfire, not round it up to "fine" to be polite.

</script>

# Catalog track removal

## Content

Tracks and whole catalogs periodically disappear from Spotify without warning when licensing deals between labels/distributors and Spotify expire or fall through — e.g. Spotify pulling hundreds of K-Pop tracks globally after an expired Kakao M licensing deal, or users reporting an artist's near-complete catalog ("The Fixx") vanishing overnight. Spotify's own terms state it may remove content "without notice." Community threads consistently report finding out only by noticing a playlist got shorter — no in-app notification, no email.

- Catalog removal is a structural licensing risk, not a bug — it recurs across labels/regions and is documented over years of community threads.
- The absence of any removal notification (in-app or email) is the recurring complaint, not the removal itself — users accept licensing exists, but want to know when it hits their library.

# Dyslexia and typing difficulty

## Content

The British Dyslexia Association defines dyslexia as a learning difficulty primarily affecting accurate and fluent word reading **and spelling**, rooted in difficulties with phonological awareness, verbal memory, and processing speed. Spelling difficulty is described as one of the most widely experienced and persistent effects — it typically continues into adulthood even when reading itself improves. A systematic review and meta-analysis of assistive-technology interventions for adolescents and adults with learning disabilities found speech-to-text/dictation tools to be an effective accommodation, because speaking bypasses the spelling and letter-sequencing bottleneck that typing requires.

## Takeaways

- For someone with dyslexia, typing difficulty is not occasional friction — it's a persistent, lifelong characteristic, present in every typing context, not just a stressful one.
- Voice/dictation input is a documented, evidence-backed accommodation, not just a convenience preference.

## Sources

- [British Dyslexia Association: What is dyslexia?](https://www.bdadyslexia.org.uk/dyslexia/about-dyslexia/what-is-dyslexia)
- [PMC: Assistive Technology Interventions for Adolescents and Adults with Learning Disabilities — Evidence-Based Systematic Review and Meta-Analysis](https://pmc.ncbi.nlm.nih.gov/articles/PMC5736156/)

# Typing while driving is dangerous

## Content

NHTSA (the US National Highway Traffic Safety Administration) documents texting/typing as the most dangerous form of distracted driving, since it combines visual, manual, and cognitive distraction at once — reading or sending a text takes a driver's eyes off the road for about 5 seconds, which at 55 mph is roughly the length of a football field driven blind. Aggregated safety research (cited via The Zebra and Forbes Advisor) puts the crash-risk increase at up to 23× for texting drivers and 3.6× for handheld phone use generally, compared to undistracted driving.

## Takeaways

- Typing on a phone while driving isn't a minor inconvenience — it's a well-documented, severe safety risk, independent of any individual driver's typing speed or accuracy.
- For a driver who is already slower/less accurate at typing (e.g. due to dyslexia), the same few seconds of required attention are stretched longer, compounding the risk rather than just adding to it.

## Sources

- [NHTSA: Distracted Driving Dangers and Statistics](https://www.nhtsa.gov/risky-driving/distracted-driving)

## Takeaways

- Voice search failure isn't a hypothetical edge case — it's an openly, repeatedly reported problem specifically for non-English names and accented speech.
- Voice input in the car is not just a "nice to have" for Spotify's own user base — its removal (via Car Thing, then "Hey Spotify") generated active pushback and reinstatement requests.

# Apple Music

Apple's music streaming service, built into the iPhone, Mac and HomePod ecosystem.

## Market position

#2 globally after Spotify: **~12.6% of the subscription market** (MIDiA, 2025) vs Spotify's ~31.7%. Apple hasn't published official numbers since 2023 (estimated ~100M subscribers).

## Features vs Spotify

- **Lossless + Spatial Audio (Dolby Atmos) at no extra cost since June 2021** — while Spotify HiFi, announced in February 2021, never launched as a separate tier (lossless only reached Spotify in 2025).
- Deep integration with the Apple ecosystem (Siri, HomePod, Watch).
- No free ad-supported plan — trial only.

## Comparison

| Category | Where they stand |
|---|---|
| Price (individual) | **$10.99/mo** (US) — a dollar under Spotify since Spotify's 2024 rise ([Apple Music](https://www.apple.com/apple-music/)) |
| Free tier | None — paid only, trial aside |
| Audio quality | Lossless + Spatial Audio (Dolby Atmos) at no extra cost since June 2021 ([Apple Newsroom](https://www.apple.com/newsroom/2021/05/apple-music-announces-spatial-audio-and-lossless-audio/)) |
| Algorithm control | The recurring complaint runs the other way — discovery rated weaker than Discover Weekly "in the good days" (see User voices) |
| Library & ownership | Your own files can live alongside streaming — upload/match via the iCloud music library |

## User voices

- The audio-quality argument was for years the main thread in "Spotify vs Apple Music" comparisons — Apple delivered lossless for free, Spotify made people wait ([What Hi-Fi?](https://www.whathifi.com/advice/spotify-hifi-quality-price-release-date-free-trial-and-latest-news)).
- Typical reason to switch: quality + price in the Apple One family bundle; typical complaint: weaker music discovery than Discover Weekly "in the good days".

## What this means for our personas

- The "I pay the same but get better quality for the money" argument lands with [The Value Auditor](../Archetypes/The%20Value%20Auditor.md).
- For Emma (iPhone, passive listening) the exit barrier is the cost of migrating playlists — see [Sister has Apple Music](../Signals/Sister%20has%20Apple%20Music.md).

# Bandcamp

Online record store and community where fans buy music and merch directly from artists.

## Market position

Not a streaming competitor in the Spotify/Apple Music sense — a direct-purchase marketplace (digital + physical/vinyl) that niche listeners and collectors use *alongside* a streaming subscription, not instead of it. Popular with electronic/underground and DIY scenes precisely because of its artist-first economics.

## Features vs Spotify

- **Direct purchase, no streaming subscription** — fans buy tracks/albums/vinyl outright; artists get roughly 85–90% of each sale (Bandcamp takes 10–15% depending on tier, plus payment processing fees), versus Spotify's per-stream royalty model.
- **Bandcamp Fridays** — periodic days where Bandcamp waives its revenue share entirely; has generated $150M+ for artists/labels since 2020.
- **No streaming catalog risk** — once purchased, a track is owned, not subject to the licensing-driven removals that hit streaming catalogs.
- **Physical + digital bundling** — vinyl/CD purchases commonly include an instant digital download, matching the "discover on streaming, own on vinyl" pattern.

## Comparison

| Category | Where they stand |
|---|---|
| Price (individual) | No subscription — you pay per release, and artists keep roughly 85–90% of each sale ([About Bandcamp](https://bandcamp.com/about)) |
| Free tier | Streaming previews on artist pages — buying is the point |
| Audio quality | Purchases download in lossless formats (FLAC among them) |
| Algorithm control | No algorithm to fight — discovery is editorial and human (Bandcamp Daily, fan collections) |
| Library & ownership | The whole pitch: bought music is owned outright, immune to catalog removals ([Tracks disappear without warning](../Signals/Tracks%20disappear%20without%20warning.md)) |

## User voices

- Framed by users and press as the ethical/fair-trade counterpart to streaming — "an even playing field for artists" (Bandcamp GM Dan Melnick).
- Niche/collector communities treat it as the place tracks *removed* from streaming catalogs can still be found and bought directly from the artist.

## What this means for our personas

- Confirms the "Spotify for discovery, Bandcamp/vinyl for ownership" pattern seen in [Tracks disappear without warning](../Signals/Tracks%20disappear%20without%20warning.md) — when a track disappears from Spotify, Bandcamp is the fallback niche listeners already know to check.
- Not a subscription-price threat (different model entirely) — the relevant competitive pressure is catalog permanence and artist economics, not price or discovery UX.

- [Music Week: As Bandcamp Friday returns, GM Dan Melnick says the platform is an 'even playing field for artists'](https://www.musicweek.com/digital/read/as-bandcamp-friday-returns-gm-dan-melnick-says-the-platform-is-an-even-playing-field-for-artists/093521)

# Deezer

French music streaming service, best known for Flow — its personalized endless mix.

## Market position

A niche player globally (single-digit share), strong in France and Brazil. Alongside Spotify, one of only two services with public quarterly reporting.

## Features vs Spotify

- **Flow** — an "endless mix" blending favourites with new discoveries, with mood/activity variants; since 2026 **Flow Tuner** gives users explicit sliders to control recommendations — exactly the algorithm control the Spotify community keeps asking for.
- HiFi as standard.

## Comparison

| Category | Where they stand |
|---|---|
| Price (individual) | **$11.99/mo** (US) — priced level with Spotify ([Deezer offers](https://www.deezer.com/offers)) |
| Free tier | Yes — ad-supported, with shuffle limits on mobile |
| Audio quality | HiFi (FLAC) as standard in the paid plan |
| Algorithm control | The strongest story on this axis: **Flow Tuner** hands users explicit sliders over recommendations ([Deezer Newsroom](https://newsroom-deezer.com/2026/02/deezer-launches-flow-tuner-personalized-recommendations/)) — and the "Flow is trash" thread shows what breaks when control is taken away ([community](https://en.deezercommunity.com/features-feedback-44/flow-is-trash-77669)) |
| Library & ownership | Streaming only — parity with Spotify, no ownership angle |

## User voices

- Fans praise Flow for accuracy and "less clicking" ([Deezer Community: What do you think of Flow?](https://en.deezercommunity.com/features-feedback-44/feedback-what-do-you-think-of-flow-24402/index2.html)).
- Critics just as loud: the "Flow is trash" thread — after algorithm changes users lost their favourite balance of familiar and new ([Deezer Community](https://en.deezercommunity.com/features-feedback-44/flow-is-trash-77669)). Lesson: even a good context feature breaks when you take control away from the user.

## What this means for our personas

- Flow Tuner is market proof that "algorithm control" ([Doesn't trust Discover Weekly](../Signals/Doesn%27t%20trust%20Discover%20Weekly.md), [The Algorithm Drifter](../Archetypes/The%20Algorithm%20Drifter.md)) is buildable — a competitor is already shipping it.

# YouTube Music

Music streaming service from Google, sold standalone or bundled with YouTube Premium.

## Market position

**~10.3% share** and the **fastest-growing global service in 2024** — a hair from overtaking Apple Music (MIDiA). Together with YouTube Premium ~125M paying (last disclosure 2024).

## Features vs Spotify

- **Bundle with YouTube Premium**: music + ad-free YouTube + background play at one price — a "two-in-one" Spotify doesn't have.
- **Student plan** (e.g. $5.49/mo in the US) aggressively targets the 18–24 segment.
- A catalogue beyond studio releases: remixes, live sets, covers from YouTube.

## Comparison

| Category | Where they stand |
|---|---|
| Price (individual) | **$10.99/mo** standalone; the **$5.49 student plan** aggressively targets 18–24 ([student plan](https://www.youtube.com/premium/student)) — and most buy it as the YouTube Premium bundle |
| Free tier | Yes — ad-supported, and the whole catalogue is on YouTube anyway |
| Audio quality | No lossless tier — streams cap at 256 kbps AAC |
| Algorithm control | "Thinks like YouTube, not a music player" — recommendations rated weaker than Spotify's by its own users (see User voices) |
| Library & ownership | Catalogue reaches past studio releases — remixes, live sets and covers straight from YouTube |

## User voices

- Among students the bundle is seen as "the best value-per-hour in college" — they buy ad-free YouTube and get music for free ([YouTube Premium Student](https://www.youtube.com/premium/student)).
- Typical complaint: music recommendations weaker than Spotify's, the app "thinks like YouTube, not a music player".

## What this means for our personas

- A direct threat to Jake ([The Value Auditor](../Archetypes/The%20Value%20Auditor.md) + [The Social Curator](../Archetypes/The%20Social%20Curator.md)): his friends already have the bundle — see [Tempted by YouTube Premium](../Signals/Tempted%20by%20YouTube%20Premium.md).

# INT-06 — Tom

**M:** How do you use Spotify when you're on the road?

**Tom (P):** Almost exclusively by voice. In the car I can't really type anyway — hands on the wheel, eyes on the road. But honestly, even when I'm not driving, I'd rather dictate than type.

<!-- anchor: dyslexia -->
**M:** Why do you prefer speaking specifically?

**P:** I have dyslexia. Writing has always been slow and error-prone for me — I have to focus on every single word. Speaking is just faster, and I don't have to second-guess whether I spelled something right. It's not something that started in the car — it's just that in the car it makes even more sense, because typing would be dumb and dangerous anyway.

<!-- anchor: voice-misfire -->
**M:** Does voice search work well?

**P:** Depends, honestly. Sometimes I say a title and the app just doesn't get it at all — it plays something completely different or asks me to repeat it. With an artist's name that's spelled or pronounced in an unusual way, it's a total coin flip. I think my accent throws it off too.

**M:** What do you do then?

**P:** I repeat it once, twice, and if it still doesn't get it, I give up and put on something I already have saved. Sometimes, if I'm at a red light, I'll even try tapping through it on the screen, which is dumb anyway, because I waste time and still end up fumbling over what to tap.

<!-- anchor: workaround -->
**P:** It'd be great if it just worked the first time. I don't want to fight with the app, I want to hear the song.

---

## Observer notes

- Dyslexia came up unprompted — Tom explained it himself as the reason for his voice preference, not just as a reaction to a question about driving.
- He clearly separates two sources of the same preference: a persistent one (dyslexia, everywhere) and a situational one (driving, car-only) — both lead to the same behavior.
- Matter-of-fact frustration, no dramatizing — he describes concrete situations rather than making general judgments about the product.

interview_id: INT-07
participant: 'Zoe, 27, graphic designer, Brooklyn — vinyl collector, active music explorer'
method: 'In-depth interview, remote (video call)'
date: 27.06.2025
abstract: Active explorer and vinyl collector: curates a large library and resents recommendation drift toward mainstream; tracks disappearing from the catalog silently break her collections; crossfade imposed over album gaps kills continuous listening; skeptical of Wrapped-style social comparison; buys directly on Bandcamp to actually own music.   # scan header - positive index for cheap triage, see Transcripts/_template.md
topics: [active-discovery, collection-curation, algorithm-drift, catalog-removal, gapless-playback, wrapped-social-comparison, pricing]
mentions_competitors: ['Bandcamp']   # EXHAUSTIVE at extraction time - [] means checked-and-none, unlike topics
---

# INT-07 — Zoe

**M:** Hi, thanks for making time. Before we start — is it okay if I record?

**Zoe (P):** Sure, no problem.

**M:** Great. Let's start with something simple — how long have you been using Spotify?

**P:** Ooh, a long time. Maybe eight years? Could be nine. I still remember the version with the monthly playback limit, do you even remember that? That gray interface.

**M:** I do, yeah. How would you describe your relationship with music in general — not just the app?

<!-- anchor: bio-relationship -->
**P:** It's a big part of my life, honestly. I've been collecting vinyl for about four years, I've probably got around a hundred and fifty records by now. I go to concerts, mostly niche electronic stuff, sometimes post-punk. I kind of treat Spotify as... I don't know, like a library for browsing before I buy? If I like something, I check whether it's out on vinyl and then I buy it.

**M:** So Spotify functions as discovery, and vinyl is the final form of ownership.

**P:** Exactly, well put. Though, of course, ninety percent of the time I'm still listening through Spotify day-to-day, because I don't always have a turntable handy.

---

<!-- anchor: usage-context -->
**M:** Tell me what a typical day with Spotify looks like for you. When do you usually put it on?

**P:** Hmm, in the morning while I'm getting ready, it's usually something more upbeat. At work — I work as a graphic designer, so I sit at a computer a lot — it depends on the task, honestly. If I'm doing something creative, a brief, research, I prefer something without vocals, some ambient or instrumental stuff, so the words don't get in the way of my thinking. But if I'm doing something mechanical, I don't know, exporting files, revisions, I can listen to pretty much anything.

**M:** And in the evening?

**P:** Evening is my time for discovery. I sit down, sometimes with records next to me, and I actually explore. That's probably my favorite moment of the week, honestly — Friday evening, new releases.

**M:** I see. And devices — what do you usually listen on?

**P:** Phone on the go, laptop at work, and I've got a Bluetooth speaker at home, a small one, sits on a shelf. And headphones, of course — at work I use headphones so I don't bother anyone else.

---

<!-- anchor: library-organization -->
**M:** How do you manage your library? Do you have a system?

**P:** Oh, that I actually have very organized, maybe even too organized. *(laughs)* I have separate playlists by genre, so for example I've got "ambient for work," I've got "techno for running," I've got "new stuff to check out" — that's a kind of working playlist where I dump everything that catches my interest from Release Radar or Discover Weekly, and then once a week, usually on Sunday, I listen through it again calmly and decide what stays and what goes.

**M:** That sounds like a fairly involved process.

**P:** It is, but it's enjoyable for me, it's not a chore. I've also got archival playlists, chronological ones, "Zoe 2022," "Zoe 2023" and so on — like my personal yearbooks.

**M:** What about Liked Songs? Do you use that?

**P:** Almost never, honestly. That's like a junk drawer for me — if I need to click something quickly, on the fly, and don't have time to assign it to a specific playlist, it goes there. But then I never go back through it, because it's already chaos in there.

---

<!-- anchor: algorithm-drift-mainstream -->
**M:** You mentioned Discover Weekly. How would you rate the accuracy of those recommendations?

**P:** That's an interesting topic, because I have mixed feelings about it. It used to be really good, I felt like it understood my taste. But I've noticed a pattern — if I listen to something more mainstream, say because a friend sent me some hit song and I wanted to check it out, then for the next week or two my entire Discover Weekly drifts toward more pop, obvious stuff. Like a single play can outweigh hundreds of hours of listening to niche electronic music.

**M:** Does that happen often?

**P:** More often than I'd like. And it's frustrating, because that's exactly why I pay for Premium, to get good recommendations in my niche, not things I'd hear on the radio or on Instagram anyway.

**M:** Do you do anything to fix it?

**P:** I've tried removing things from my history, but that doesn't always work. Sometimes I just ignore Discover Weekly for two or three weeks until it "goes back to normal" on its own. It's a bit absurd that I have to wait for the algorithm to forget.

---

<!-- anchor: catalog-removal -->
**M:** Has it ever happened that an album or a track disappeared from Spotify?

**P:** Oh my god, yes, and that probably annoys me the most out of everything. I had a situation once where an entire playlist I'd been building for maybe six months lost five or six tracks overnight — they just vanished, no warning. It turned out to be some licensing issue, the artist had some dispute with the label or something like that, I don't remember exactly.

**M:** What did you do then?

**P:** I had to manually search for where those tracks still existed, whether they were on Bandcamp, whether I could buy the mp3 somewhere else. That's exactly the moment when I think to myself, "this is why I buy vinyl" — because nobody's taking a record off my shelf. But yeah, it's annoying, because I waste time rebuilding something I already had organized.

**M:** Did Spotify notify you about it in any way?

**P:** No, absolutely nothing. I noticed myself, because the playlist suddenly had a different length than I remembered. There was no notification, no email, nothing.

---

<!-- anchor: gapless-playback -->
**M:** You mentioned evening listening, exploring, earlier. What about when you listen to longer, continuous things, like DJ mixes or concept albums?

**P:** That's another thing that irritates me. Crossfade and those automatic transitions between tracks sometimes really ruin the whole experience, especially with albums that are meant to be one continuous whole — a lot of electronic music is like that, where tracks flow into each other, and if Spotify throws its own fade in there, it kills the artist's whole intent. I had to learn to turn off crossfade manually in settings, but even then sometimes it resets after an update and I have to remember to check.

**M:** Have you tried other apps for that kind of listening?

**P:** I had a phase with a local player, for FLAC files, when I bought stuff directly from artists. But that's extra hassle, moving files around, so I mostly just stay on Spotify and accept that sometimes it's not perfect.

---

<!-- anchor: social-features -->
**M:** Let's move to something else — what do you think about the social features, like Wrapped or Blend?

**P:** Wrapped is... *(laughs)* ...it's fun, but I have kind of a weird feeling about it. Because on one hand it's nice to see a summary, but on the other hand I know everyone posts it on Instagram, and I kind of unconsciously start comparing my stats to other people's. "Oh, this person listened to more minutes than me" or something like "my top artist isn't original enough." It's dumb, I know, but that's how I am.

**M:** What about Blend?

**P:** I did Blend once with my boyfriend, as a joke. We ended up with this weird playlist that was half his rap, half my ambient, jumping back and forth without any sense. Fun little curiosity, but not something I'd use regularly.

---

<!-- anchor: pricing -->
**M:** How do you feel about the price of Premium relative to what you actually use?

**P:** I pay and I don't complain, honestly. I don't listen to podcasts, audiobooks don't interest me, but the sound quality itself and the lack of ads are worth the price to me. Maybe if they raised it again I'd think twice, but for now I don't have an issue with it.

**M:** Have you ever considered any of the competing services?

**P:** I looked into Bandcamp as a platform, but that's a different model, you buy directly there, it's not streaming in that sense. Among the typical streaming services I'm staying with Spotify, because that's where my whole history is, all my playlists, and moving that elsewhere would be a nightmare.

---

**M:** We're wrapping up. Is there anything I didn't ask that you'd like to mention?

**P:** I think just that the most frustrating thing for me is the feeling that the deeper I get into a niche, the less Spotify is able to help me, and that's exactly the moment when good recommendations would be most valuable. Like the product was designed for someone who listens to the mainstream, and I'm there kind of by accident.

**M:** Thank you so much for the conversation.

**P:** No problem, I enjoyed talking.

---

## Observer notes

- Zoe is the opposite of the chaotic library seen in other participants (cf. Emma) — very systematic, a deliberate curator of her own collection, but she still treats Liked Songs as a "junk drawer" just like Emma does.
- Strong, recurring theme: algorithm drift toward the mainstream after a single "atypical" play — a similar mechanism to what Emma reported (party context/shared account), but here the cause is different: a conscious, one-off check of something popular.
- New, previously unreported theme: **tracks/albums disappearing from the catalog without notice** — a real, documented industry problem (licensing issues), worth verifying in Evidence.
- New theme: **crossfade ruining continuous/concept listening** (DJ mixes, albums meant as a whole) — different from the earlier Smart Shuffle theme, but related: the product imposes a behavior that destroys the listener's deliberate intent.
- Wrapped/Blend: a mild but real discomfort tied to social comparison pressure — a new theme, not raised by other participants before.
- The "active niche explorer" segment looks like a distinct archetype from the ones seen so far (Utility Listener, Passive Discoverer, Social Curator) — worth considering something like "The Niche Curator" if this transcript gets processed further.

# Spotify — research product context

Shared product context for all personas in the project. `/persona-talk` reads this file before a conversation about features — the persona knows the product from its own experience, and the researcher knows from here what we're talking about.

---

## What the product is

Spotify — a music, podcast, and audiobook streaming service. ~602M monthly active users, of which ~263M pay for Premium (2024). Largest age segment: 25–34 (~29%), just behind it 18–24 (~26%) — [Business of Apps](https://www.businessofapps.com/data/spotify-statistics/).

## Existing features relevant to the research

| Feature | What it does | State / context |
|---|---|---|
| **Liked Songs** | one shared "dumping ground" of saves | no tags/folders; the community reports finding problems — [thread](https://community.spotify.com/t5/Your-Library/Library-search-doesn-t-work-inside-all-playlists-but-more/td-p/5539763) |
| **Discover Weekly** | a weekly recommendations playlist | documented erosion of trust — ["constantly terrible"](https://community.spotify.com/t5/Your-Library/Discover-Weekly-constantly-terrible/td-p/5245708) |
| **Smart Shuffle** | injects recommendations into a user's playlist | mass complaints, a forced opt-out — ["Worst feature ever made"](https://community.spotify.com/t5/Your-Library/Smart-Shuffle-Will-NOT-Turn-off-Worst-feature-ever-made/td-p/5688153) |
| **daylist** | a playlist that changes with the time of day | viral (+20,000% searches, Jan 2024) — proof of demand for contexts — [NBC](https://www.nbcnews.com/tech/social-media/spotify-daylist-trend-how-to-find-search-music-rcna134708) |
| **Plans (Individual/Student/Duo/Family)** | the pricing model | 22.2% share accounts by password — [MBW](https://www.musicbusinessworldwide.com/netflix-is-launching-a-password-sharing-crackdown-in-the-next-few-weeks-in-the-us-could-spotify-follow/); no profiles within an account — [Live Idea](https://community.spotify.com/t5/Live-Ideas/Having-the-option-to-create-multiple-profiles-under-one-cost/idi-p/7442943) |
| **Podcasts / audiobooks** | spoken content in the same app | ~32% of users engage; the rest pay but don't use — [Wired Clip](https://wiredclip.com/spotify-podcast-statistics/) |

## Candidate features (to test persona reactions)

From the research graph (`Ideas/`):

1. **[Smart Skip](Ideas/Idea1%20Quick-skip%20mode%20(Smart%20Skip).md)** — a gesture to preview 5s of each mix track's chorus
2. **[Pre-fetching](Ideas/Idea2%20Seamless%20background%20loading%20(Pre-fetching).md)** — loading the start of upcoming tracks in the background
3. **[Listening Modes / "that wasn't me"](Ideas/Idea3%20Context%20mode%20(Listening%20Modes).md)** — flagging a session as "a different context", outside algorithm training

Additional concepts to probe (from personas' Pain Relievers — no Idea file yet):

4. **Multi-profile** — separate recommendation profiles on one account (like Netflix)
5. **Lite plan** — a cheaper "music only" plan, without podcasts/audiobooks
6. **Smart Library** — auto-tagging Liked Songs by mood/energy/tempo

## Comparison

<!-- Our own row set for the app's Compare view ("us" as a column). Same rules as the
     competitors' tables: one row per compare_categories entry, sourced claims only. -->

| Category | Where we stand |
|---|---|
| Price (individual) | **$11.99/mo** (US) since the June 2024 rise ([Spotify Premium](https://www.spotify.com/us/premium/)) |
| Free tier | Yes — ad-supported, shuffle-limited on mobile ([Spotify Premium](https://www.spotify.com/us/premium/)) |
| Audio quality | Lossless shipped only in 2025, inside Premium — four years after the never-launched HiFi tier was announced ([MBW](https://www.musicbusinessworldwide.com/spotify-is-finally-launching-lossless-but-its-not-part-of-a-super-premium-tier/)) |
| Algorithm control | The weak spot: Smart Shuffle's forced opt-out drew mass complaints ([community](https://community.spotify.com/t5/Your-Library/Smart-Shuffle-Will-NOT-Turn-off-Worst-feature-ever-made/td-p/5688153)), while daylist's virality proved demand for context ([NBC](https://www.nbcnews.com/tech/social-media/spotify-daylist-trend-how-to-find-search-music-rcna134708)) |
| Library & ownership | One flat Liked Songs pool — no tags or folders, search inside playlists is a documented pain ([community](https://community.spotify.com/t5/Your-Library/Library-search-doesn-t-work-inside-all-playlists-but-more/td-p/5539763)); streaming only, nothing is owned |

## The rule for a persona in a feature conversation

The persona doesn't know internal names or the roadmap — it reacts to a **description of how a feature works** in the language of its own experience and pains. Its reactions must be consistent with its Signals/Pains (e.g. Emma will appreciate Listening Modes but ask "do I have to turn it on every time?" — because she avoids effort).

# Research backlog — questions from persona sessions

A collector of research questions that emerged from AI persona conversations (`/persona-talk`) and queries (`/persona-query`).

> ## ⚠️ Overriding rule
> **A synthetic persona conversation NEVER creates Signals or Evidence.**
> A persona is a synthesis of existing data — not a new source. A conversation can only
> **generate questions for real research** (interviews, tests, surveys with people).
> A `Signal` is created only after contact with a live user; then → `/extract-findings`.

## Where this comes from

- The "Researcher context" block in `/persona-talk` ends with a **"Questions to dig into"** section.
- When you hit a persona's **"Known unknown"** (an L1 gap — assumption-level, no data) — that lands here too.
- Occasionally, `/persona-talk` names a **"Blind spot"** — a question neither the researcher nor the persona's data raised at all during a session, not a gap the data already flagged. Rare by design — most sessions won't produce one.
- On `[exit]` the skill offers to append these questions to this list.

## The columns

`Kind` — `qualitative` / `quantitative` / `mixed`: the **shape of the answer** that would
settle the question, which decides the method (and a method decides where the answer
lands: a session we run makes a `Signal`, an aggregate makes `Evidence`).

`Priority` — `critical` / `major` / `minor`: how much rests on the answer. An AI run
writes the bare word and may revise it later. **A value ending in `(locked)` was set by
the researcher by hand — no AI run may change, clear or re-word it**, only disagree with
it out loud. An empty cell means nobody has decided; the app shows a guess read from the
wording and writes nothing.
